server.port=9090
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.routes[0].id=student-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://student-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/students/**

spring.cloud.gateway.server.webflux.routes[1].id=school-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://school-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/schools/**
